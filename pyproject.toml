[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opd-learning-signals"
version = "0.1.0"
description = "Code and reproducibility artifacts for Why On-Policy Distillation Sometimes Fails: Vanishing Learning Signals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "pandas>=2.2,<3", "scipy>=1.12,<2"]
test = ["hydra-core==1.3.2"]

[project.scripts]
opd = "opd.__main__:main"

[tool.setuptools]
# The CLI resolves recipes, data and vendored backends relative to the checkout,
# so only editable installs (pip install -e .) are supported.
packages = ["opd"]
